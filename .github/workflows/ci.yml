name: CPU conformance

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU PyTorch and project
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
          python -m pip check
      - name: Static checks and tests
        run: |
          ruff check .
          ruff format --check .
          pytest -q
      - name: CLI and artifact gates
        run: |
          amlv --help
          amlv doctor
          amlv demo --out artifacts/ci
          python scripts/check_artifacts.py artifacts/ci
          amlv validate --config config/validation.example.yaml --out artifacts/example
          python scripts/check_artifacts.py artifacts/example
          set +e
          amlv demo --out artifacts/fault --inject-mismatch
          status=$?
          set -e
          test "$status" -eq 1
          python scripts/check_artifacts.py artifacts/fault
      - name: Build package
        run: python -m build
